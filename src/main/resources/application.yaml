spring:
  application:
    name: pedido
  data:
    web:
      pageable:
        max-page-size: 100

  datasource:
    url: jdbc:postgresql://localhost:5433/pedidos
    username: pedido
    password: ${DB_PASSWORD:pedido123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration